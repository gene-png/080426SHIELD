# `pre-commit install` alone installs only the pre-commit stage, so the
# pre-push hook below (#143) ran for nobody. This makes the documented bare
# install cover both. EXISTING clones must re-run `pre-commit install`: the
# setting changes new installs only.
default_install_hook_types: [pre-commit, pre-push]
# Installing the pre-push hook type must not also run every commit-time hook
# (formatters, mypy, gitleaks) over the push range. `default_stages` covers
# only hooks whose MANIFEST declares no stages; three below declare their own,
# and are pinned explicitly where they are listed.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Its v4.6.0 manifest declares `stages: [commit, push, manual]`, which
        # `default_stages` does not override: without this it would rewrite
        # files, and fail, on every push.
        stages: [pre-commit]
      - id: end-of-file-fixer
        # Its v4.6.0 manifest declares `stages: [commit, push, manual]`, which
        # `default_stages` does not override: without this it would rewrite
        # files, and fail, on every push.
        stages: [pre-commit]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        # Its v4.6.0 manifest declares `stages: [commit, push, manual]` too.
        stages: [pre-commit]
        args: ["--maxkb=512"]
        exclude: ^reference-docs/
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # `rev` matches `apps/api/pyproject.toml`'s `ruff==0.16.3` (#168). It was
  # v0.6.9 -- the same divergence as prettier's, in a hook that also rewrites,
  # and recorded in the prettier comment below rather than beside the thing it
  # was about. Unlike prettier this is a plain `rev` bump: the repo is
  # maintained and the tag exists.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # `rev` matches `apps/api/pyproject.toml`'s `black==26.5.1` (#168). Same
  # shape, same reason, same one-line fix.
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^apps/api/app/
        additional_dependencies: ["pydantic>=2.0", "sqlalchemy>=2.0"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-q", "-c", "pyproject.toml"]
        files: ^apps/api/app/
        additional_dependencies: ["bandit[toml]"]

  # PRETTIER, AT THE VERSION THE LOCKFILE PINS (#168).
  #
  # This was `pre-commit/mirrors-prettier` at `rev: v3.1.0`, whose `prettier`
  # hook id defaults to `--write`, while CI checked 3.9.6 — eight minors ahead
  # (versions here are as of 2026-08-30; the lockfile has since moved).
  # So the MANDATORY pre-commit step rewrote every commit into a state CI then
  # rejected. Measured 2026-08-30:
  #
  #   npx -y prettier@3.1.0 --check "**/*.{ts,tsx,js,jsx,json,md,yml,yaml}"
  #   -> Code style issues found in 46 files.  exit=1
  #
  # Not fixable by bumping `rev`: that mirror is ARCHIVED upstream (last push
  # 2024-04-11), v3.1.0 is its newest stable tag, and everything above it is a
  # v4 alpha. Verified via the GitHub API, not inferred.
  #
  # The version is READ from `pnpm-lock.yaml` rather than written here, because
  # CI runs `pnpm install --frozen-lockfile` and then `pnpm format:check` — the
  # lockfile is what the machine actually reads. `package.json` holds a RANGE
  # (`^3.9.6`) that names no version and admits 3.10.x, and a literal here would
  # be a third home for one fact, and the one nothing checks. See the script.
  #
  # NO REFORMAT LANDS WITH THIS. `main` is already 3.9.6-clean, because CI keeps
  # it so; the 46 files are what 3.1.0 says about a 3.9.6-formatted tree, not
  # work this change creates. Confirmed by running 3.9.6 `--check` on the branch.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (version read from pnpm-lock.yaml)
        entry: scripts/prettier-hook.sh
        language: script
        exclude: ^(reference-docs|pnpm-lock\.yaml)
        # The same extensions `package.json`'s `format` / `format:check` scripts
        # glob, so the hook and CI disagree about the VERSION nowhere and about
        # the FILE SET nowhere either.
        files: \.(ts|tsx|js|jsx|json|md|yml|yaml)$

  - repo: local
    hooks:
      - id: api-unit-tests
        name: API unit tests
        # #143: `pytest ... || echo "skipped"` printed "skipped" over a FAILING
        # suite and let the push through. The container check is now the `if`,
        # and pytest runs unguarded in its branch, so a red suite fails the push.
        #
        # A SKIP IS NOT A PASS, so it FAILS CLOSED, with exit 2 -- the repo's
        # could-not-look code, distinct from pytest's own (my call, overturnable):
        # pre-commit prints only "Passed"/"Failed" on the line people read, and
        # a skip that exits 0 reads as Passed there. The message names the cause
        # -- docker absent, the daemon unreachable, or the api container down --
        # and the per-hook bypass in BOTH shells this repo is developed in. Never
        # `--no-verify`: that skips every hook.
        #
        # It tests the tree the SHARED api container mounts, not the ref being
        # pushed (#203), and says so.
        entry: bash -c 'hint="To push without the API unit tests -- Git Bash, SKIP=api-unit-tests git push; PowerShell, \$env:SKIP=\"api-unit-tests\"; git push; Remove-Item Env:SKIP"; if ! command -v docker >/dev/null; then echo "NOT RUN - docker is not on PATH. $hint"; exit 2; fi; if ! info_err=$(docker info 2>&1 >/dev/null); then echo "NOT RUN - docker info failed, so the daemon is unreachable or permission was denied - $(printf "%s" "$info_err" | head -n 1). $hint"; exit 2; fi; if ! svc=$(docker compose ps --status running --services 2>&1); then echo "NOT RUN - docker compose failed - $(printf "%s" "$svc" | head -n 1). $hint"; exit 2; fi; if ! printf "%s\n" "$svc" | grep -qx api; then echo "NOT RUN - the api container is not running. $hint"; exit 2; fi; echo "API unit tests run against the tree the shared api container mounts, which may not be the ref being pushed (#203)."; exec docker compose exec -T api pytest -m unit'
        language: system
        verbose: true
        pass_filenames: false
        stages: [pre-push]
