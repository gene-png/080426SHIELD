name: Scheduled triggers

# A deferred item with no trigger is a wish. This makes the trigger fire itself.
#
# This repo has four things "tracked but not scheduled" (#59, #111, and now the
# post-MVP audit item), and the pattern that put them there is the same one
# D-051 recorded for the §14 gate: a rule that depends on someone remembering has
# failed here nine recorded times. "Post-MVP" and "later" are not triggers —
# nothing observes them, so nothing ever fires.
#
# So: an issue labelled `scheduled-trigger` carries a `Trigger-date:` line in its
# body. Once that date passes, this posts ONE comment and applies
# `trigger-fired`, which is also the guard against posting again. A human still
# decides what to do; what changes is that the decision is put in front of them
# instead of waiting to be rediscovered.
#
# NOT a gate. It cannot block anything and it cannot fail a merge — it only
# raises its hand, and since #531 a failed run raises it on an issue. A
# non-blocking mechanism that runs beats a blocking one that gets turned off
# (the mutation sweep's own reasoning).

on:
  schedule:
    # 07:00 UTC Mondays. After the mutation sweep, and on a day someone reads.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      exercise_failure_report:
        description: >-
          Also run --report-failure once, live, to prove it can open or comment
          on the tracking issue. It opens a real issue; close it afterwards.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  fire-due-triggers:
    name: Fire due scheduled triggers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Comment on any issue whose trigger date has passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_LOG: ${{ runner.temp }}/triggers.log
        working-directory: apps/api
        run: python -m scripts.fire_scheduled_triggers

      # A red scheduled run is on no one's path: this one failed every week for
      # a month and nobody looked (#531). So a failure files, or comments on, an
      # issue carrying the board labels, which IS on someone's path.
      #
      # IF THIS STEP ITSELF FAILS, the run is red and reported to nobody -- the
      # state before #531. Its `gh` calls were first written with no live run
      # behind them (2026-09-25); dispatch with `exercise_failure_report` to run
      # it once for real.
      - name: Put a failed run in front of a person
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: apps/api
        run: python -m scripts.fire_scheduled_triggers --report-failure "${{ runner.temp }}/triggers.log"

      # Dispatch-only, and only when the run itself succeeded (a failed run
      # already reports through the step above). The issue still carries the
      # failure title and opening line; the log it quotes says EXERCISE.
      - name: Exercise the failure report live (dispatch only)
        if: success() && inputs.exercise_failure_report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: apps/api
        run: |
          echo "EXERCISE, not a failure: dispatched with exercise_failure_report to prove --report-failure works live. Close this issue." > "${{ runner.temp }}/exercise.log"
          python -m scripts.fire_scheduled_triggers --report-failure "${{ runner.temp }}/exercise.log"
