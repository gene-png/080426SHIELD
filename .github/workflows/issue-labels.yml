name: Issue labels

# Every OPEN issue carries `mvp-blocking` plus exactly one tier, or
# `unowned-with-reason`. That is CLAUDE.md's filing rule, and nothing enforced
# it: the first run of this check found 148 of 181 open issues breaking it
# (2026-09-23), 71 of them with no labels at all -- invisible to the board,
# which is the only view used to decide what to work on.
#
# NOT a merge gate. Issue labels are not a property of a pull request, so this
# cannot sensibly block one. It runs when labels change and daily, and it goes
# red when the board and the rule disagree -- which is the signal. Same
# reasoning as scheduled-triggers.yml: a non-blocking check that runs beats a
# blocking one that gets turned off.

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  schedule:
    # 06:30 UTC daily.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  filing-rule:
    name: Every open issue is on the board or unowned-with-reason
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check every open issue against the filing rule
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        working-directory: apps/api
        run: python -m scripts.check_issue_labels
