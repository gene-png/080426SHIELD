# BENCHMARK ONLY -- never merged. Runs on pushes to bench/** branches only, so
# it reports no required check. Measures A1 (the migrate-once template, in
# tests/conftest.py) as it would ship, three times per variant:
#   serial      CI's exact command, `pytest -m unit tests/unit`
#   xdist4      the same plus pytest-xdist -n 4, one runner
#   shard k/4   #680's pytest_shard plugin, four runners
name: Bench A1

on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  single:
    name: ${{ matrix.variant }} run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [serial, xdist4]
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install API + dev tools (as CI)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install pytest-xdist
        if: matrix.variant == 'xdist4'
        run: pip install "pytest-xdist==3.6.1"
      - name: pytest -m unit (${{ matrix.variant }})
        working-directory: apps/api
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          extra=""
          if [ "${{ matrix.variant }}" = "xdist4" ]; then extra="-n 4"; fi
          start=$(date +%s)
          set +e
          pytest -m unit tests/unit $extra --junitxml="$GITHUB_WORKSPACE/out/junit.xml" 2>&1 | tail -n 40
          status=${PIPESTATUS[0]}
          set -e
          echo "pytest_exit=$status seconds=$(( $(date +%s) - start ))" | tee "$GITHUB_WORKSPACE/out/result.txt"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl-${{ matrix.variant }}-${{ matrix.run }}
          path: out/
          retention-days: 14

  sharded:
    name: shard ${{ matrix.shard }}/4 run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install API + dev tools (as CI)
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest -m unit (shard ${{ matrix.shard }}/4)
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/bench
          PYTEST_SHARD: ${{ matrix.shard }}/4
          PYTEST_SHARD_RECORD: ${{ github.workspace }}/out/ran.txt
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          start=$(date +%s)
          set +e
          pytest -m unit tests/unit -p pytest_shard --junitxml="$GITHUB_WORKSPACE/out/junit.xml" 2>&1 | tail -n 40
          status=${PIPESTATUS[0]}
          set -e
          echo "pytest_exit=$status seconds=$(( $(date +%s) - start ))" | tee "$GITHUB_WORKSPACE/out/result.txt"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl-shard-${{ matrix.run }}-${{ matrix.shard }}
          path: out/
          retention-days: 14
