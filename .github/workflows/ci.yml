name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + black + pytest + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API + dev tools
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: ruff check
        working-directory: apps/api
        run: ruff check .

      - name: black --check
        working-directory: apps/api
        run: black --check .

      # W8a tier 1 (#72): tests that cannot fail. Runs BEFORE pytest — it is a
      # two-second static pass, and a suite that is green for the wrong reason
      # should be caught before spending 13 minutes proving it is green.
      - name: test-integrity sweep
        working-directory: apps/api
        run: python -m scripts.check_test_integrity tests

      # #336. A disclosure the product writes must reach a person -- on a
      # screen or in a delivered artifact. `CLAUDE.md` carries the rule; this
      # is what makes it hold, because the reflex survives the rule until the
      # rule has a gate.
      - name: disclosures reach a reader
        run: python apps/api/scripts/check_disclosure_consumers.py

      # The audit-gate test module SKIPS itself when it cannot find
      # `.github/workflows` above it -- correct inside the api container, which
      # mounts only `apps/api` (#314). But nothing asserted the skip does not
      # fire HERE, on a full checkout, so the `..`-versus-`...` guard that
      # module exists for could be silently retired and every test in
      # `test_root_discovery.py` would stay green while `pytest -m unit`
      # reported `2 skipped` and exited 0.
      #
      # It cannot be closed by a pytest test: a test living in the tree that
      # skips itself skips with it. So it is asserted from OUTSIDE, in the one
      # place a full checkout is guaranteed.
      - name: the audit-gate tests must not skip on a full checkout
        working-directory: apps/api
        run: |
          python - <<'PY'
          import pathlib, sys
          from tests._paths import find_workflows_dir

          seed = pathlib.Path("tests/unit/test_audit_gate_collects_only_this_branch.py").resolve()
          found = find_workflows_dir(seed)
          if found is None:
              print("FAIL: find_workflows_dir returned None on a full checkout.")
              print("      The audit-gate module would SKIP here, retiring the")
              print("      two-dots-versus-three guard with nothing going red.")
              sys.exit(1)
          if not (found / "audit-gate.yml").is_file():
              print(f"FAIL: {found} has no audit-gate.yml; the module asserts it does.")
              sys.exit(1)
          print(f"ok: workflows resolved to {found}")
          PY

      # Same shape, same reason, for #347's size gate. Its real-file assertion
      # (`test_the_real_file_carries_the_canary_as_its_last_line`) SKIPS when
      # the repo root is unreachable -- correct in the api container, which
      # mounts only `apps/api`. But a skip and a pass are the same green, so
      # nothing would notice if it began skipping HERE, on a full checkout,
      # and the canary's position would stop being checked by the stronger of
      # its two surfaces. A spec that self-skips on a precondition is UNTESTED,
      # not passing, and that cannot be asserted from inside the tree -- a test
      # that skips takes its own assertion with it.
      - name: the size-gate real-file test must not skip on a full checkout
        working-directory: apps/api
        run: |
          python - <<'PY'
          import subprocess, sys
          done = subprocess.run(
              [sys.executable, "-m", "pytest", "-q",
               "tests/unit/test_claude_md_size_gate.py"
               "::test_the_real_file_carries_the_canary_as_its_last_line",
               "-rs"],
              capture_output=True, text=True,
          )
          print(done.stdout[-2000:])
          if done.returncode != 0:
              print("FAIL: the real-file canary assertion did not pass.")
              sys.exit(1)
          if "skipped" in done.stdout:
              print("FAIL: it SKIPPED on a full checkout, so the canary's")
              print("      position is no longer checked by this surface.")
              sys.exit(1)
          print("ok: the real-file canary assertion ran and passed")
          PY

      # Stray control characters, repo-wide. Runs from the ROOT, not apps/api,
      # because the files this defect actually lands in are DECISIONS.md and
      # CONTEXT.md -- prose about regexes, where an interpolated `\b` becomes an
      # invisible BACKSPACE byte inside a sentence explaining word boundaries.
      # FOUR instances on one branch: two pre-existing, one in the commit that
      # fixed those two, and one in this very comment -- caught by this gate on
      # its first run, before it had ever run in CI. Also a two-second pass.
      - name: control-character sweep
        run: python apps/api/scripts/check_no_control_chars.py .

      # DELIVERY_PLAN's stated total vs the sum of its own rows. Two instances,
      # both written by someone who had just written the rule against them --
      # the second inside a section headed "and the parts sum to it". Same
      # argument as the control-character sweep above: mechanise it.
      - name: plan totals sum
        run: python apps/api/scripts/check_plan_totals.py DELIVERY_PLAN.md

      # CLAUDE.md reached 210,958 bytes against a 150,000-byte reader limit, so
      # the last 29% was cut before any agent read it -- and the cut landed on
      # the merge rule's condition-5 path list. Every gate ran on every PR and
      # not one measured the file they are all described in; it surfaced as a
      # tool error rather than a red build. Same argument as the two sweeps
      # above: the rule existed and only a machine keeps it.
      - name: governance file fits in a reader
        run: python apps/api/scripts/check_claude_md_size.py --require-canary CLAUDE.md

      # The image optimizer stays unmounted, AND nothing imports sharp directly.
      # Together those are the whole reachability argument for the sharp advisory;
      # neither alone is. Measured against the STANDALONE artifact, not the dev
      # server: /_next/image answers 400 without the config line and 404 with it,
      # while a genuinely absent route answers 404 either way. sharp is traced into
      # the standalone bundle regardless, so the config removes the ROUTE, not the
      # dependency -- which is why the second half below matters.
      #
      # THE TWO HALVES HAVE DIFFERENT FAILURE CHARACTERISTICS AND ONLY ONE IS
      # COMPLETE. Read that before trusting the second further than it can carry.
      #
      #   images.unoptimized -- a PRESENCE claim over a CLOSED set. The value is
      #   true or it is not, and the node import reads what the build consumes.
      #   This half is complete.
      #
      #   no direct sharp import -- an ABSENCE claim over an OPEN set. There is no
      #   finite list of ways to name a module, so this pattern is a FLOOR, not a
      #   census. It fails loudly the day someone adds an import it recognises, and
      #   it is silent about spellings nobody has thought of. Same standing as
      #   leave_row_oracle's registry check being the one gateable property while
      #   the oracle itself is not automated.
      #
      # Its known false-positive surface is a bare quoted string exactly "sharp" or
      # "sharp/...", which fails visibly rather than silently -- the right direction
      # for a security assertion. "sharp-corner", "sharpen", "sharpness", prose and
      # `{ sharp: boolean }` all correctly miss.
      #
      # THAT FALSE POSITIVE IS DELIBERATE. If it fires on a variable or literal,
      # RENAME THE VARIABLE. Do not loosen the pattern back toward a
      # statement-shaped one (`from "sharp"`, `require("sharp")`) -- that is the
      # version this replaced, and it missed dynamic import, subpath imports and
      # require with internal spacing while reporting green. A false positive that
      # someone "fixes" by weakening the check is how these regress.
      #
      # `@img/sharp-*` is KNOWINGLY OUT OF SCOPE. Those are sharp's own platform
      # binaries and nothing imports them directly, so matching them would be noise.
      # Recorded as a decision rather than left as an accident, because that exact
      # scoped family is what defeated the lockfile scope-check on #225: being
      # quoted and scoped is what made a pattern there unable to fail. If anyone
      # ever imports one directly, this gate is silent about it.
      #
      # Reads the VALUE via a node import rather than grepping the source: prettier
      # reflows a growing config object across lines as a matter of course, and a
      # line-anchored pattern would go red on correct code. ci.yml already records
      # why that is worse than not running -- a check red on every PR regardless of
      # the diff teaches everyone to ignore it.
      #
      # Deliberately a step rather than a fixture under the exemption registry
      # (#223): that registry is filed and unbuilt, so "gate it there" resolves to
      # "gate it never, for now". Fold this in when #223 is built.
      - name: image optimizer stays unmounted
        run: |
          # `-e` is ON whether or not it is written here: GitHub invokes this
          # step as `bash -e {0}`, and `set -uo pipefail` does not cancel it.
          # Made explicit so the `|| rc=$?` guards below read as necessary
          # rather than as belt-and-braces -- without them, `-e` aborts the
          # script at a command substitution whose command "failed", and grep
          # FAILS WHEN IT FINDS NOTHING. This gate exited 1 with no output on a
          # clean tree for exactly that reason; see the note at the foot of the
          # step.
          set -euo pipefail
          CFG=apps/web/next.config.mjs
          # "I could not look" is exit 2 and never exit 1 (D-051). A missing or
          # unevaluable config must not read as "the line was removed".
          if [ ! -r "$CFG" ]; then
            echo "cannot read $CFG -- refusing to guess whether the route is mounted" >&2
            exit 2
          fi
          # `|| node_rc=$?` is what keeps `-e` from killing the script here.
          # Without it a missing or broken node aborts at this line and the
          # step exits 1 with no message -- reported as "the line was removed"
          # when the truth is "I could not look", which is the exact inversion
          # D-051 exists to prevent.
          node_rc=0
          val=$(node --input-type=module -e "
            const m = await import('./apps/web/next.config.mjs');
            process.stdout.write(String(m.default?.images?.unoptimized));
          " 2>/dev/null) || node_rc=$?
          if [ "$node_rc" -ne 0 ] || [ -z "$val" ]; then
            echo "could not evaluate $CFG -- refusing to guess" >&2
            exit 2
          fi
          if [ "$val" != "true" ]; then
            echo "images.unoptimized is '$val', not true." >&2
            echo "That re-mounts /_next/image and re-opens this app's path into" >&2
            echo "sharp's affected image loaders. If deliberate, the sharp" >&2
            echo "reachability argument needs re-establishing first." >&2
            exit 1
          fi
          # Matches the MODULE SPECIFIER, not the statement form. A
          # statement-shaped pattern (`from "sharp"`, `require("sharp")`) missed
          # three real spellings when tested: dynamic `await import("sharp")`, a
          # subpath `"sharp/lib/resize"`, and `require( "sharp" )` with spaces.
          # The subpath is the one that matters -- it reaches the same library
          # through the same install and is a plausible thing to write. Anchoring
          # on the quoted specifier covers static, dynamic, require with any
          # spacing, and subpaths in one pattern, and cannot be defeated by
          # formatting.
          #
          # Excludes build output and vendored deps: Next ships its own
          # `_sharp = require('sharp')` inside next/dist/server/image-optimizer.js,
          # which this matched on its first run. That line is the optimizer calling
          # sharp -- the thing the config unmounts -- not one of our callers.
          # THE BUG THIS STEP SHIPPED WITH, kept named because the fix looks
          # like noise otherwise: grep exits 1 when it finds NOTHING, so under
          # `-e` this assignment aborted the script on a CLEAN tree. The step
          # exited 1, printed nothing at all, and its pass state was the only
          # state it could not reach. `rc=$?` on the next line never ran.
          # Found by CI, on the first completed run -- four local runs in four
          # directions could not see it, because an interactive `bash` has no
          # `-e`.
          rc=0
          hits=$(grep -rnE "['\"]sharp(/[^'\"]*)?['\"]"                    apps packages --include=*.ts --include=*.tsx --include=*.js --include=*.mjs                    --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=build 2>/dev/null) || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "could not search for sharp imports -- refusing to guess" >&2
            exit 2
          fi
          if [ -n "$hits" ]; then
            echo "a direct sharp import appeared:" >&2
            echo "$hits" >&2
            echo "sharp is unpatched at 0.34.5; a direct caller reaches the" >&2
            echo "affected GIF/TIFF/VIPS loaders regardless of the optimizer." >&2
            exit 1
          fi
          echo "image optimizer unmounted (images.unoptimized=true), no direct sharp import"
          # ---------------------------------------------------------------
          # THE NOTE, referenced above. Read it before "simplifying" the
          # `|| rc=$?` guards away.
          #
          # This step's defect history is the worked example on #223, and the
          # last entry is the one that matters here: it was verified locally in
          # four directions and was RED on its first completed CI run, exiting 1
          # with EMPTY output on a clean tree. Cause: `bash -e` plus grep's
          # exit-1-on-no-match. Local runs used an interactive `bash`, which has
          # no `-e`, so no amount of local care could have reached it.
          #
          # THE LESSON: a CI step is not the script you wrote, it is the script
          # AS THE RUNNER INVOKES IT. Verify it that way:
          #
          #   python - <<'PY'
          #   import yaml
          #   d = yaml.safe_load(open(".github/workflows/ci.yml"))
          #   s = [x for x in d["jobs"]["python"]["steps"]
          #        if x.get("name") == "image optimizer stays unmounted"]
          #   open("gate-step.sh", "w", newline="\n").write(s[0]["run"])
          #   PY
          #   bash -e gate-step.sh; echo "exit=$?"; rm -f gate-step.sh
          #
          # Git Bash form, run from the repo root; not run in PowerShell. The
          # path is RELATIVE on purpose: the first draft of this note wrote
          # `/tmp/step.sh`, and on Windows that is `C:\tmp` to Python and
          # somewhere else entirely to Git Bash, so the documented command
          # failed the first time it was executed verbatim -- in the same
          # session that added the rule requiring exactly that check.
          #
          # `bash -e` is not optional in that command. Without it you reproduce
          # your own shell, not the runner's, and this gate passed that way for
          # its whole life while being incapable of passing in CI.
          #
          # Directions verified this way on 2026-09-08, each producing the exit
          # code named: clean tree 0; config line removed 1; config file absent
          # 2; config reformatted by prettier 0; static / require / spaced
          # require / dynamic / subpath / single-quoted sharp specifiers all 1;
          # `sharpen`, `"sharp-corner"`, `@img/sharp-linux-x64` and a `// sharp`
          # comment all 0. Re-run the set after ANY edit here.
          # ---------------------------------------------------------------

      # Every gate above proves something about the repo. NOTHING proved the
      # gates themselves could fail, and this repo keeps shipping checks whose
      # inputs cannot distinguish their pass state from their fail state (#213)
      # -- a predicate that excluded the very operation that prompted it, a
      # duplicate-D regex collapsing D-059a into D-059, a suite whose every
      # fixture made two candidate fields coincide. Each gate now carries
      # fixtures it must pass, fixtures it must FAIL, and at least one
      # adversarial case; a gate with neither fixtures nor a stated deferral
      # fails this step, so silence cannot be how coverage shrinks.
      # #318. Two shell gates shipped with real both-states assertions inside
      # and NOTHING invoking either -- no workflow, no CI step, no script. They
      # proved something to nobody for weeks, and the harness below could not
      # say so because it discovered gates by globbing `apps/api/scripts/*.py`.
      # It now discovers these too and FAILS when a gate no workflow runs, so
      # this step is not optional decoration: delete it and `gates can fail`
      # goes red naming the gate it can no longer find a caller for.
      - name: shell gates
        run: |
          bash tests/gates/prettier_hook.sh
          bash tests/gates/web_install_guard.sh
          # Asserts that every argument guard in this directory, plus the two
          # named `scripts/` entries, actually REFUSES an unknown flag and an
          # empty argument -- with a message, because exit 2 alone is also what
          # a crash produces. Three of those guards shipped asserted by
          # nothing: delete any of the three and every other gate in the repo
          # still printed its certificate.
          bash tests/gates/argument_guards.sh
          # `verify-in-worktree.sh` derived the PRIMARY TREE from its own
          # location, so in a worktree it resolved to the worktree -- the one
          # tree guaranteed to lack `packages/*/node_modules`. Docker creates a
          # missing bind source as an EMPTY directory rather than failing, so
          # the real modules were shadowed and 20 of 53 vitest files never
          # collected, reported against the branch under test. This gate builds
          # a real throwaway worktree, because a test of the refusal alone stays
          # green with the derivation reverted.
          bash tests/gates/verify_in_worktree_mounts.sh
          # The web arms print a bound ONLY on positive evidence a tool ran:
          # a stub `docker` drives 125/127/no-marker/verdict-shaped failures, a
          # positive control, and a TERM mid-self-test (143, no probe left).
          # The first fix keyed on one cause and let "0 error(s)" print over 127.
          bash tests/gates/verify_in_worktree_status.sh
          # A self-test nobody runs is furniture. `red-on-revert.sh` is the
          # harness that keeps `git checkout --` out of the restore path, and
          # it shipped with a restore check that compared a file to itself --
          # a green no matter what, in the one place a reader would look for
          # the guarantee. It went unnoticed for eleven days because nothing
          # executed it. This is one line and it exercises all three exit
          # codes on a scratch file.
          bash scripts/red-on-revert.sh --self-test

      - name: gates can fail
        run: python apps/api/scripts/check_gate_fixtures.py

      # An enumerated whitespace class in the single LLM egress path. Twice a
      # separator there was written by listing the characters someone could
      # think of, and both times it leaked -- the second 190 lines above the
      # comment explaining the first. A third instance was caught by this script
      # on its first run, in code written the same hour.
      - name: separator classes in the redactor
        run: python apps/api/scripts/check_separator_classes.py apps/api/app/ai/redact.py

      # The gateable properties of the LEAVE-row oracle. The oracle itself is a
      # required step, not a gate -- scoring a row pass/fail needs judgement
      # about what the row was written for, and a tool that claimed to do that
      # would assert more than it knows.
      #
      # TWO things are facts rather than judgements, and both are checked here:
      #
      #   * a LEAVE table nobody registered guards for. Without this such a
      #     table reports clean -- "I could not look" and "nothing to complain
      #     about" on one exit code, the shape this repo has produced three
      #     times in its own tooling.
      #   * a table DECLARED not-LEAVE that holds rows the redactor leaves
      #     byte-identical (#221). The registry was checking that every table
      #     had a LABEL, never that the label was true, so a mislabelled table
      #     was invisible twice: its rows unscored, and the gate reporting
      #     complete BECAUSE somebody had written the label down. Its first run
      #     found three such rows inside IDEMPOTENCE_CASES.
      #
      # The step name changed with the scope. A step called "registry" that also
      # checks labels is a narrower name than the thing it does, which is the
      # defect CLAUDE.md records for comments and applies here for the same
      # reason: it is what a reader checks instead of reading the script.
      - name: LEAVE-row oracle registry and labels
        working-directory: apps/api
        run: python scripts/leave_row_oracle.py --check-registry

      # Whether the oracle CAN MEASURE, which is not what the step above asks
      # (#299). `--check-registry` returns before `build_mutations` is called,
      # so a mutation anchor that has drifted out of `redact.py` is invisible
      # to it -- and two had, leaving the whole oracle exiting 2 for an unknown
      # length of time while CI stayed green.
      #
      # This is the repo's recorded shape one level up: a gate whose
      # correctness lives in something nothing checks. `check_test_integrity`
      # had it in a `working-directory:` line; this one has it in the distance
      # between an anchor string and a file that keeps being edited.
      #
      # Seconds to run, no redaction pass, no judgement. Running the FULL
      # oracle here is deliberately not done -- scoring a row needs judgement
      # and `CLAUDE.md` already decided that.
      - name: LEAVE-row oracle can still measure
        working-directory: apps/api
        run: python scripts/leave_row_oracle.py --check-anchors

      # Spelled counts of things that change, in the SHARED documents. Blocking:
      # a wrong count in CLAUDE.md or DELIVERY_PLAN.md is a claim every reader of
      # the repo is entitled to rely on, and anyone may fix it. The enforced set
      # is defined in the script and NOT restated here -- a list of documents in
      # this file would be a second copy of the one in the gate, free to drift
      # from it, which is the shape several of this repo's gates were built for.
      - name: recalled counts (shared docs)
        run: python apps/api/scripts/check_recalled_counts.py

      # The personal status files, REPORT ONLY, and only what is NEW.
      #
      # The precedent is pip-audit below (`continue-on-error: true`), NOT the
      # LEAVE-row oracle registry above -- that one blocks, and its comment
      # explains why the ORACLE is not automated, a different question.
      #
      # pip-audit can report without blocking because Dependabot turns its
      # findings into PRs: that step names the channel by which its output
      # reaches a person. This step has no Dependabot, so it writes to the run
      # summary, which is on the run page without anyone expanding a step.
      #
      # AND IT REPORTS ONLY THE DELTA against a committed baseline. The first
      # version of this step reported every finding every time, which would have
      # meant a permanently non-empty block on every PR -- and this same file
      # says, of a different check, that one red on every PR regardless of the
      # diff "teaches everyone to ignore it, which is worse than not running
      # it". A channel built to be read, given content guaranteed to make it
      # unread. Zero delta now means an empty summary.
      #
      # It fails in the right direction: a stale baseline shows up as NOISE
      # (findings reported that someone already accepted), never as silence.
      #
      # Why report-only rather than blocking, and the two files differ:
      # dave.md is Dave-only, so a blocking gate on it would hold Gene's PR red on
      # a line Gene may not edit -- stopping the wrong person. gene.md is
      # agent-maintained (D-063), so that argument does not apply to it; it stays
      # advisory because it is a status file rewritten most sessions and a count
      # gate would fire constantly on churn that is correct when written. Two
      # files, two reasons, and they are not interchangeable. Posture, not a
      # carve-out.
      #
      # `tr -d '\r'`: the baseline may be regenerated on a Windows host, where
      # Python emits CRLF; CI is Linux and emits LF. Normalising both sides
      # keeps the diff about content rather than about whose machine wrote it.
      - name: recalled counts in personal status files (report only, delta)
        continue-on-error: true
        run: |
          set +e
          base=.github/recalled-counts-advisory-baseline.txt
          if [ ! -f "$base" ]; then
            echo "advisory baseline missing at $base -- refusing to report"
            echo "### Recalled counts (advisory): BASELINE MISSING" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "Cannot tell new findings from accepted ones. This is not a clean report." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 2
          fi
          python apps/api/scripts/check_recalled_counts.py --advisory --porcelain > /tmp/live.txt
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "gate exited $code before producing a list" >&2
            cat /tmp/live.txt
            # The summary, not just the log. This branch used to write only to
            # stdout/stderr, so a missing context/*.md exited 2, continue-on-error
            # kept the job green, and the run summary was EMPTY -- indistinguishable
            # on that page from "no new findings". Silence, from the one mechanism
            # this step exists to deliver through.
            {
              echo "### Recalled counts (advisory): GATE DID NOT PRODUCE A LIST"
              echo
              echo "Exit code $code. This is not a clean report and not a finding."
              echo "Most likely a target named in ADVISORY_TARGETS no longer exists."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit "$code"
          fi
          grep -v '^#' "$base" | tr -d '\r' | sort > /tmp/base.txt
          tr -d '\r' < /tmp/live.txt | sort > /tmp/now.txt
          comm -13 /tmp/base.txt /tmp/now.txt > /tmp/new.txt
          if [ ! -s /tmp/new.txt ]; then
            echo "advisory: no new recalled counts beyond the accepted baseline"
            exit 0
          fi
          echo "advisory: new recalled counts in context/*.md"
          cat /tmp/new.txt
          {
            echo "### New recalled counts in personal status files"
            echo
            echo "Advisory set: printed by the gate itself on stderr, in the"
            echo "step log above -- NOT restated here. The prose that used to"
            echo "sit on this line named the two files from memory,"
            echo "a second copy of ADVISORY_TARGETS free to drift from it, which"
            echo "is what the enforced set two steps above already refuses."
            echo "Only findings NOT in \`.github/recalled-counts-advisory-baseline.txt\` are listed."
            echo
            echo '~~~'
            cat /tmp/new.txt
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 1

      # #540: a test that exists but never runs. A test CI does not select, or
      # a spec gated on a variable no workflow sets, reads as covered and never
      # executes -- worse than a vacuous test, which at least reports. Both
      # gates allow the known backlog only with reasons (#500; #483's two until
      # #560 moved them to e2e/manual/) and
      # ratchet: a baselined test that now runs or no longer exists, and an
      # exemption for a variable now set or no longer read, are findings.
      - name: every unit test is one CI runs (#540)
        working-directory: apps/api
        run: python -m scripts.check_ci_selection

      - name: every e2e env gate is set or exempted (#540)
        run: python apps/api/scripts/check_e2e_env_gates.py

      - name: pytest -m unit
        working-directory: apps/api
        run: pytest -m unit tests/unit

      - name: bandit
        run: bandit -q -c pyproject.toml -r apps/api/app

      # Work Order F: dependency audit. Surfaces advisories; Dependabot opens the
      # fix PRs, so this reports without blocking on a freshly-published CVE.
      - name: pip-audit
        working-directory: apps/api
        continue-on-error: true
        run: pip-audit

  web:
    name: Web (prettier + eslint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json's packageManager field; specifying it
      # here too makes pnpm/action-setup hard-error on the double definition.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Work Order F: dependency audit (Dependabot opens the fix PRs).
      - name: pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: prettier --check
        run: pnpm format:check

      - name: eslint
        run: pnpm -F web lint

      - name: tsc --noEmit
        run: pnpm -F web typecheck

      - name: vitest
        run: pnpm -F web test

      - name: next build
        env:
          NEXTAUTH_SECRET: ci-only-not-a-real-secret-1234567890
          API_BASE_URL: http://localhost:8000
        run: pnpm -F web build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # The workflow default is `contents: read` (top of this file). gitleaks
    # writes its findings back to the pull request, so with only read access it
    # failed every run with 403 "Resource not accessible by integration" — on
    # PRs with no secrets in them at all. A check that is red on every PR
    # regardless of the diff teaches everyone to ignore it, which is worse than
    # not running it: the one time it goes red for a real reason, it looks the
    # same as the other times.
    #
    # Scoped to this job rather than raised at the top of the file, so no other
    # job gains write access it does not need.
    #
    # Caveat: pull requests opened by Dependabot run with a read-only token no
    # matter what this block says (GitHub grants Dependabot PRs restricted
    # permissions by design), so those may still report 403 here.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Host-run Playwright smoke suite against the full composed stack. This
  # reproduces the canonical fresh-stack bring-up documented in e2e/README.md
  # and proven end-to-end locally in S2 T2 (down -v + reseed + full suite, 27/27
  # green on a pristine DB). CI runs with no .env, so web stays on :3000 and the
  # docker-compose.yml defaults apply. Those defaults now include
  # SHIELD_EMAIL_DELIVERY_ENABLED=true (Sprint 7 T3), so `docker compose up -d`
  # brings up MailHog and the s21 email-verify/reset spec RUNS here (no longer
  # self-skips). The runner has Docker + Compose v2.
  e2e:
    name: E2E (Playwright smoke suite)
    runs-on: ubuntu-latest
    # 30 was not enough once the suite reached 73 tests: the 2026-08-05 run on
    # PR #5 was terminated at 30m18s with Playwright still going (no assertion
    # failures — the job simply ran out of budget), while the same suite takes
    # ~37 min locally. The specs share one seeded database and run
    # `workers: 1` deliberately, so wall-clock scales with the spec count and
    # will keep growing. Sharding is the real fix and needs per-shard database
    # isolation; until then this ceiling has to clear a full serial run with
    # headroom for a slow runner.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Bring up postgres/redis/minio/keycloak/mailhog/api/web from the repo
      # compose file. NEXTAUTH_SECRET mirrors the web job's ci-only value so we
      # don't ship the literal dev placeholder; every other var uses the
      # compose-file default, all of which are ci-safe.
      - name: Compose up
        env:
          NEXTAUTH_SECRET: ci-only-not-a-real-secret-1234567890
        run: docker compose up -d

      # The api container only serves after `alembic upgrade head`; Keycloak
      # cold start is the slow gate. Poll with a generous budget and FAIL LOUDLY
      # (dump logs, non-zero exit) if the stack never becomes healthy.
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "api healthy after ${i} attempt(s)"; exit 0
            fi
            sleep 5
          done
          echo "::error::api did not become healthy within budget"
          docker compose logs api keycloak
          exit 1

      - name: Seed demo tenant
        run: docker compose exec -T api python scripts/seed_demo.py

      # web's first boot installs pnpm deps into the container before next dev
      # starts listening. Poll on :3000 with the same fail-loud contract.
      - name: Wait for web
        run: |
          for i in $(seq 1 72); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "web up after ${i} attempt(s)"; exit 0
            fi
            sleep 5
          done
          echo "::error::web did not come up within budget"
          docker compose logs web
          exit 1

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # #540: every spec on disk must be in CI's run. `--list` applies the
      # config's selection (testIgnore / testMatch / grep / projects) exactly as
      # the run step below does, with the same cwd and no arguments -- pinned by
      # test_e2e_spec_listing_gate.py -- and needs no browser or stack.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: every spec on disk is one CI runs (#540)
        working-directory: e2e
        run: |
          npx playwright test --list > "$RUNNER_TEMP/playwright-list.txt"
          python ../apps/api/scripts/check_e2e_spec_listing.py --list-file "$RUNNER_TEMP/playwright-list.txt" --root ..

      # GitHub Actions sets CI=true, so playwright.config.ts applies retries: 1.
      - name: Run Playwright suite
        working-directory: e2e
        run: npx playwright test

      # #487: a user working on one page was signed out once the access token
      # expired, because a server-side `auth()` rotated the refresh token and
      # discarded the new one. The regression spec needs to span several
      # expiries, so it runs AFTER the main suite against api+web recreated
      # with a 60 s access TTL. Only these two services change; the database
      # and its seed carry over. The spec itself fails if the TTL is not short,
      # so a skipped recreate cannot turn into a vacuous pass.
      - name: Recreate api and web with a 60-second access token (#487)
        env:
          NEXTAUTH_SECRET: ci-only-not-a-real-secret-1234567890
          JWT_ACCESS_TTL_SECONDS: "60"
        run: |
          docker compose up -d --force-recreate api web
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null && curl -sf http://localhost:3000 >/dev/null; then
              echo "api and web up after ${i} attempt(s)"; exit 0
            fi
            sleep 5
          done
          echo "::error::api/web did not come back after the short-TTL recreate"
          docker compose logs api web
          exit 1

      - name: Session survives several access-token expiries (#487)
        working-directory: e2e
        env:
          E2E_SESSION_TTL: "1"
        # Its own output dir: Playwright empties `test-results/` at the start of
        # every run, which would delete the main suite's retry traces before the
        # upload step below.
        # ONLY the TTL spec: the sign-out race spec assumes no rotation is due
        # (true at the default TTL, in the main suite) and a 60 s TTL breaks that.
        run: npx playwright test session/session-survives-refresh.spec.ts --output test-results-487

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/test-results-487/
          retention-days: 7
          if-no-files-found: ignore

  # Hosted-demo bring-up job (Sprint 9 T9). Runs the one-command reset in its
  # own isolated runner so its `docker compose down -v` cannot touch the e2e
  # job's stack, builds the PRODUCTION web image (shield-web:demo) via the
  # docker-compose.demo.yml overlay, seeds the Atlas story inside the script,
  # and drives the opt-in demo-journey spec against the just-reset prod stack.
  # No .env is needed — the compose defaults (web on :3000, WEB_PORT unset) are
  # what baseUrl.ts resolves to, so the reset script and Playwright agree.
  demo:
    name: Demo (hosted-demo reset + journey spec)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The demo overlay's `volumes: !reset []` needs Compose >= 2.24 (the tag
      # is a silent no-op below it, leaking the base dev bind-mounts into the
      # prod image and breaking the standalone bundle). Log the version and FAIL
      # LOUDLY below the floor rather than debug a mis-tagged mount later.
      - name: Docker Compose version (require >= 2.24 for !reset)
        run: |
          docker compose version
          ver="$(docker compose version --short | sed 's/^v//')"
          major="$(echo "$ver" | cut -d. -f1)"
          minor="$(echo "$ver" | cut -d. -f2)"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 24 ]; }; then
            echo "::error::docker compose $ver is below the 2.24 floor required for the '!reset' tag in docker-compose.demo.yml"
            exit 1
          fi
          echo "docker compose $ver satisfies the >= 2.24 floor"

      # One-command reset: down -v -> up -d --build (shield-web:demo) -> /ready
      # full-matrix poll -> seed_demo.py -> fail-loud web wait. The script owns
      # the whole bring-up; a failed prod build or a stalled web boot exits
      # non-zero here (Sprint 9 T8 fixed the silent web wait).
      - name: Demo reset (--demo overlay)
        run: bash scripts/demo-reset.sh --demo

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # SHIELD_DEMO_SMOKE=1 opts the demo-journey spec in (it self-skips
      # otherwise, so it can never run against a stack it didn't just reset).
      - name: Run demo-journey spec
        working-directory: e2e
        env:
          SHIELD_DEMO_SMOKE: "1"
        run: npx playwright test demo/

      # Always-run diagnostics mirroring the e2e job's fail-loud pattern: on a
      # red run the compose state + logs are the first thing you want, and a
      # green run's output is cheap to skip past.
      - name: Diagnostics (compose ps + logs)
        if: always()
        run: |
          echo "==== docker compose ps ===="
          docker compose -f docker-compose.yml -f docker-compose.demo.yml ps
          echo "==== docker compose logs (tail) ===="
          docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --no-color --tail=200

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
