name: Audit gate

# Plan §14 — "every workstream merges on a clean adversarial-reviewer audit, not
# on a green suite" — was skipped on three consecutive code PRs (#93, #94, #95),
# each green, each putting a defect on main that the audit found afterwards.
#
# A SEPARATE workflow from ci.yml on purpose. This needs `edited` in its
# triggers: without it, pasting the audit section into the description does not
# re-run the check, so a legitimately-fixed PR stays red and can only be cleared
# by pushing an empty commit — and a compliant body edited to remove the section
# after a green run is never re-checked. Putting `edited` on ci.yml instead would
# re-run the 20-minute Playwright suite every time someone fixes a typo in a PR
# description.
#
# THIS GATE IS BINDING. "Adversarial audit recorded" is registered in the branch
# protection rules for `main` as a required status check — configured 2026-08-20
# (D-054) and re-verified against the GitHub API on 2026-08-25, one of seven
# required checks. See DELIVERY_PLAN.md, "Branch protection".
#
# The registration is a GitHub setting rather than a file here, so nothing in the
# repo can prove it; re-derive it with
# `gh api repos/{owner}/{repo}/branches/main/protection` rather than trusting
# this comment.
#
# [CORRECTED 2026-09-01] This block previously read "a workflow job only REPORTS
# … Until it is done, this is a visible red X and nothing more", and cited D-051
# rather than D-054. Both were false from 2026-08-20 onward, and the pointer sent
# a reader to a decision that does not contain the correction. A developer opening
# this file to decide whether the gate mattered read that it did not. Closes the
# second half of #108; the `CLAUDE.md` half was closed by D-057.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  audit-gate:
    name: Adversarial audit recorded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for `origin/<base>` to exist so the three-dot diff resolves.
          # If it is ever shallow, `git diff` exits non-zero and `bash -e` fails
          # the step — red, not a false green.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the changed paths
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          echo "changed paths:"; cat /tmp/changed.txt

      - name: Read the PR body
        env:
          # Via env, not inline: a PR body is untrusted text, and interpolating
          # it into a shell line is a script-injection hole.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/body.md

      - name: Require recorded audit evidence
        working-directory: apps/api
        run: python -m scripts.check_audit_evidence --changed-files /tmp/changed.txt --body /tmp/body.md

  # A SEPARATE job, so it reports as its own check rather than folding a
  # different failure into "Adversarial audit recorded". It shares this
  # workflow's `edited` trigger, which this check needs more than the audit gate
  # does: the usual fix is to reword the PR description, and without `edited`
  # that would leave the PR red with no way to clear it.
  issue-close-guard:
    name: No accidental issue closes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `origin/<base>` must exist for the three-dot range below to resolve.
          # A shallow clone makes `git log` fail, and `bash -e` turns that into a
          # red step rather than an empty commit list that would read as clean.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the title, description and every commit message
        env:
          # Via env, never inline. A PR title or body is untrusted text and
          # interpolating it into a shell line is a script-injection hole -- the
          # same reasoning the audit-gate job already documents for the body.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_TITLE" > /tmp/pr_title.txt
          printf '%s' "$PR_BODY"  > /tmp/pr_body.txt
          git log --format=%B "origin/${{ github.base_ref }}...HEAD" > /tmp/pr_commits.txt
          echo "commit messages collected:"; wc -l < /tmp/pr_commits.txt

      - name: The PR template must not satisfy the audit gate by itself
        # Its text goes into every PR body, so one character decides whether this
        # check means anything. The commented examples use "->" and not ":"
        # because this checker does not strip HTML comments -- restore the colon
        # and every PR passes having recorded nothing, in a body that renders no
        # audit block at all.
        #
        # This lives in CI rather than pytest because the api container mounts
        # only apps/api, so no test in that tree can read .github/.
        working-directory: apps/api
        run: >-
          python -c "import sys;
          from pathlib import Path;
          from scripts.check_audit_evidence import missing_evidence;
          body = Path('../../.github/pull_request_template.md').read_text(encoding='utf-8');
          p = ' '.join(missing_evidence(body));
          sys.exit('UNFILLED PR TEMPLATE SATISFIES THE AUDIT GATE -- the commented
          examples must use an arrow, not a colon. missing_evidence() said: ' + (p or '(nothing)'))
          if ('no \"Findings:\" line' not in p or 'no \"Disposition:\" line' not in p)
          else print('PR template correctly fails the gate when unfilled.')"

      - name: Reject undeclared issue closes
        working-directory: apps/api
        run: |
          python -m scripts.check_issue_references \
            --title /tmp/pr_title.txt \
            --body /tmp/pr_body.txt \
            --commits /tmp/pr_commits.txt
