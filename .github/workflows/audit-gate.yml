name: Audit gate

# Plan §14 — "every workstream merges on a clean adversarial-reviewer audit, not
# on a green suite" — was skipped on three consecutive code PRs (#93, #94, #95),
# each green, each putting a defect on main that the audit found afterwards.
#
# A SEPARATE workflow from ci.yml on purpose. This needs `edited` in its
# triggers: without it, pasting the audit section into the description does not
# re-run the check, so a legitimately-fixed PR stays red and can only be cleared
# by pushing an empty commit — and a compliant body edited to remove the section
# after a green run is never re-checked. Putting `edited` on ci.yml instead would
# re-run the 20-minute Playwright suite every time someone fixes a typo in a PR
# description.
#
# THIS GATE IS BINDING. "Adversarial audit recorded" is registered in the branch
# protection rules for `main` as a required status check — configured 2026-08-20
# (D-054) and re-verified against the GitHub API on 2026-08-25, one of seven
# required checks. See DELIVERY_PLAN.md, "Branch protection".
#
# The registration is a GitHub setting rather than a file here, so nothing in the
# repo can prove it; re-derive it with
# `gh api repos/{owner}/{repo}/branches/main/protection` rather than trusting
# this comment.
#
# [CORRECTED 2026-09-01] This block previously read "a workflow job only REPORTS
# … Until it is done, this is a visible red X and nothing more", and cited D-051
# rather than D-054. Both were false from 2026-08-20 onward, and the pointer sent
# a reader to a decision that does not contain the correction. A developer opening
# this file to decide whether the gate mattered read that it did not. Closes the
# second half of #108; the `CLAUDE.md` half was closed by D-057.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  # #182: `gh pr view --json closingIssuesReferences` needs to read the PR and
  # the issues it links. READ only, and nothing beyond those two -- this
  # workflow judges a PR and must never be able to change one.
  pull-requests: read
  issues: read

jobs:
  audit-gate:
    name: Adversarial audit recorded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for `origin/<base>` to exist so the three-dot diff resolves.
          # If it is ever shallow, `git diff` exits non-zero and `bash -e` fails
          # the step — red, not a false green.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the changed paths
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          echo "changed paths:"; cat /tmp/changed.txt

      # THE DIFF, not just the names, because `.github/` files are judged by
      # CONTENT. A path match cannot tell a `uses:` ref bump from a rewrite of
      # this workflow, and the manifest guard below refuses to answer without it.
      - name: Collect the diff
        run: git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/diff.txt

      - name: Read the PR body
        env:
          # Via env, not inline: a PR body is untrusted text, and interpolating
          # it into a shell line is a script-injection hole.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/body.md

      # DEPENDABOT IS EXEMPT FROM THIS STEP, and the exemption is HERE rather
      # than in the script on purpose.
      #
      # The gate requires a `## Adversarial audit` section in the PR body. A
      # Dependabot PR has a body Dependabot wrote, and nobody can edit it into
      # compliance without taking over authorship of the PR -- so the gate is
      # RED BY CONSTRUCTION for that entire class, and the only ways to clear it
      # are to merge past a red required check or to close the PR and redo the
      # bump by hand. Both are worse than the exemption: the first teaches that
      # a red gate is negotiable, and the second is how security bumps sit
      # unmerged.
      #
      # AUTHOR-BASED, in the WORKFLOW, because that is the only place the author
      # is known. `check_audit_evidence.py` is handed a changed-file list and a
      # body; it has no way to learn who opened the PR, and giving it one would
      # mean passing an identity into a script whose whole job is judging text.
      #
      # IT FAILS CLOSED, and that is the property to preserve through any edit.
      # The condition is a `!=` against one exact login, so every value that is
      # not that login RUNS the step -- including `null`, which is what
      # `user.login` is on a trigger that carries no `pull_request` payload. An
      # `==` here would invert it and exempt everyone except Dependabot.
      #
      # WHAT THIS REMOVES, stated without a compensating control it does not
      # have. THE FIRST VERSION OF THIS COMMENT CLAIMED ONE.
      #
      # It said "a Dependabot PR still needs `gh pr review --approve` from a
      # named human, which is branch protection and not this gate". MEASURED
      # 2026-09-22, and it is false:
      #
      #     gh api repos/{owner}/{repo}/branches/main/protection
      #       required_pull_request_reviews.required_approving_review_count -> 0
      #       enforce_admins                                                -> false
      #
      # Nothing enforces a review. So this step's skip removes the ONLY enforced
      # check on these PRs and leaves a convention in its place. That is
      # probably the right trade with four security updates stuck -- see below --
      # but it has to be argued on those terms rather than on a control that
      # exists only in a sentence. Whether to turn a real review requirement on
      # is a decision for the humans, not something this workflow should imply
      # an answer to.
      #
      # The audit block exists so an adversarial reviewer's findings are
      # recorded; there are no findings to record about a version bump, and a
      # block written to satisfy the matcher is the decorative-marker defect.
      # The step below bounds that justification by CONTENT so it cannot be
      # inherited by a human pushing code onto a bot branch.
      #
      # LIVE, NOT LATENT -- and this comment first said the opposite. It read
      # "zero Dependabot PRs are open as of 2026-09-22", which was true when
      # measured and false within the hour. Four are open and every one is
      # blocked on this exact check:
      #
      #     #465  github-actions group      #467  anthropic requirement
      #     #466  ruff 0.16.3 -> 0.16.8     #468  npm-minor-patch group
      #
      # <!-- counted: gh pr list --state open --author app/dependabot --json number | jq length -> 4, 2026-09-22 -->
      #
      # A stuck queue you can name is a stronger justification than a
      # hypothetical one, and the stale figure is why rule 2 says to carry the
      # command rather than the number.
      # THE OTHER HALF OF THE EXEMPTION, and without it the exemption is a hole.
      #
      # The skip above is keyed on AUTHOR; its justification is about CONTENT
      # ("no findings to record about a lockfile bump"). A maintainer can push
      # commits to a Dependabot branch -- the routine case is a bump that breaks
      # something and a human fixing it in place -- and
      # `pull_request.user.login` stays `dependabot[bot]`. So the exemption
      # follows the BRANCH, and arbitrary human-authored code would merge with
      # the required audit check green and no audit block anywhere. That is the
      # class #93/#94/#95 record putting a client-facing fabricated gap on main.
      #
      # This step runs ONLY for the exempted author and fails when that PR
      # touches anything outside the manifest and lockfile set, naming the
      # paths. A human pushing code onto a bot branch is blocked rather than
      # inheriting an exemption written for a version bump.
      #
      # Its verdict lands in THIS job, so it reports under the same check the
      # exemption belongs to -- the audit requirement and its bound are one
      # question, unlike the merge-rule job which is a different one.
      #
      # `.github/` IS JUDGED BY CONTENT, not by path, and the first version of
      # this guard got that wrong: it allowed `.github/workflows/*.yml` by path,
      # so a bot-authored PR could have rewritten THIS FILE -- deleting the step
      # below -- and passed. Every changed line in a `.github/` file must now be
      # a `uses: <owner>/<repo>@<ref>` bump.
      #
      # VALIDATED IN BOTH DIRECTIONS on 2026-09-22, and the first attempt only
      # did one. "All four open bot PRs pass" establishes the allow-list is wide
      # enough; it says nothing about narrow enough -- and #465 passed precisely
      # BECAUSE workflows were permitted, so the run meant to validate the guard
      # exercised the dangerous case and recorded it as a pass. An allow-list
      # validated only against benign traffic is certified for coverage, never
      # for restriction. So:
      #
      # THE EVIDENCE BELOW REPLACES A SINGLE NEGATIVE CASE THAT DID NOT REACH
      # THE CLAIM. It read "#465's real diff + one planted `continue-on-error`
      # -> exit 1", and adversarial review convicted it on this paragraph's own
      # standard: a planted `continue-on-error` is not a `uses:` line at all, so
      # it sits entirely OUTSIDE the admitted language. It establishes that the
      # guard refuses obviously foreign content; it never tests whether the
      # admitted language is narrow. Three real holes lived inside it, all
      # measured at exit 0 before the fix.
      #
      # Probes, measured 2026-09-23. Every row below except the first is
      # exercised by a named test in `tests/unit/test_bot_pr_manifest_guard.py`
      # or a fixture under `tests/gates/check_bot_pr_is_manifest_only/`; the
      # first (`all four real bot PRs`) is a one-off run against live PRs and
      # has no test behind it, which is worth knowing since it is the row that
      # answers "does this still pass real traffic".
      #
      # The count that stood here said SIX above EIGHT rows -- so the
      # date-and-measurement certificate covered six of them and a reader
      # could not tell which two were uncertified. Deleted rather than
      # corrected, per the rule about numbers describing a list beside them.
      #
      #   all four real bot PRs, real diffs                    -> exit 0
      #   a real `uses:` bump PAIR (-@v4 / +@v7)               -> exit 0
      #   a real dependency bump in a package.json             -> exit 0
      #   OWNER SWAP  -gitleaks/... / +attacker/...            -> exit 1  (was 0)
      #   LONE ADDED  +uses: attacker/action@v1, no removal    -> exit 1  (was 0)
      #   package.json "build": "next build && curl ... | sh"  -> exit 1  (was 0)
      #   a content-judged path with no --diff                 -> exit 2
      #   a `.github/` diff with ZERO changed content lines    -> exit 2
      #
      # The three that were 0: `_USES_BUMP` matched a line SHAPE and never
      # checked that anything was BUMPED -- a bump is a PAIR, same owner/repo
      # with different refs, which no single-line regex can express -- and
      # `package.json` was judged by PATH under a claim `ci.yml` falsifies,
      # since it runs `format:check`, `lint`, `typecheck`, `test` and `build`,
      # every one a script defined in a `package.json`.
      #
      # What the four actually touch, by file rather than by category, because
      # "manifests only" was true and misleading at once:
      #
      #   #465  .github/workflows/{audit-gate,mutation-sweep,scheduled-triggers}.yml
      #         -- every changed line a `uses:` bump, checked
      #   #466  apps/api/pyproject.toml
      #   #467  apps/api/pyproject.toml
      #   #468  apps/web/package.json, package.json,
      #         packages/design-system/package.json, pnpm-lock.yaml
      - name: An audit-exempt bot PR must be manifest-only
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        working-directory: apps/api
        run: |
          python scripts/check_bot_pr_is_manifest_only.py             --author '${{ github.event.pull_request.user.login }}'             --changed-files /tmp/changed.txt             --diff /tmp/diff.txt

      - name: Require recorded audit evidence
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: apps/api
        run: python -m scripts.check_audit_evidence --changed-files /tmp/changed.txt --body /tmp/body.md

  # A SEPARATE job, so it reports as its own check rather than folding a
  # different failure into "Adversarial audit recorded". It shares this
  # workflow's `edited` trigger, which this check needs more than the audit gate
  # does: the usual fix is to reword the PR description, and without `edited`
  # that would leave the PR red with no way to clear it.
  issue-close-guard:
    name: No accidental issue closes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `origin/<base>` must exist for the three-dot range below to resolve.
          # A shallow clone makes `git log` fail, and `bash -e` turns that into a
          # red step rather than an empty commit list that would read as clean.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: A failed GitHub query must leave no verdict behind
        # Runs BEFORE the query it is about, so a broken publish decision stops
        # the job rather than producing a verdict nobody can trust. #182's
        # guard tells "GitHub linked nothing" from "I could not look" by
        # whether the --linked file EXISTS, and only the collect step below can
        # honour that: `> file || true` creates the file before `gh` runs, so a
        # failed query used to leave an empty one and the guard printed
        # "clean -- no closing references (verified against GitHub)".
        #
        # The gate EXTRACTS the block from this file and runs it against a
        # stubbed `gh`, so it goes red when the block changes rather than
        # agreeing with a copy of itself. `--self-test` puts the old shape back
        # and requires the gate to fail; without that step a gate that can
        # never fail reports the same green as one that works.
        run: |
          bash tests/gates/close_guard_linked_file.sh
          bash tests/gates/close_guard_linked_file.sh --self-test

      - name: Collect the title, description and every commit message
        env:
          # Via env, never inline. A PR title or body is untrusted text and
          # interpolating it into a shell line is a script-injection hole -- the
          # same reasoning the audit-gate job already documents for the body.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # For `gh pr view` below (#182). The job's `permissions:` block grants
          # `pull-requests: read` and `issues: read` and nothing more -- reading
          # which issues a PR links is the whole requirement, and this workflow
          # must not be able to write anything.
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$PR_TITLE" > /tmp/pr_title.txt
          printf '%s' "$PR_BODY"  > /tmp/pr_body.txt
          # TWO dots, and the difference is the whole bug.
          #
          # For `git diff`, `A...B` means "changes since the merge base". For
          # `git log` it means the SYMMETRIC DIFFERENCE -- every commit on A
          # that B lacks, as well as B's own. Same spelling, opposite meaning,
          # which is why this read as correct for as long as it did.
          #
          # So this collected the BASE's commits whenever the branch was behind,
          # and the guard then judged a PR on prose nobody on it had written.
          # It stayed silent only because no message on `main` had ever carried
          # a closing keyword beside a number -- until #269's squash, whose
          # subject ends `(#115)` and whose body says "The guard written to
          # close #115 reproduced #115 on that input". Every open PR three
          # commits behind then failed on someone else's sentence.
          #
          # `A..HEAD` is the branch's own commits and nothing else.
          git log --format=%B "origin/${{ github.base_ref }}..HEAD" > /tmp/pr_commits.txt
          echo "commit messages collected:"; wc -l < /tmp/pr_commits.txt

          # #182. What GitHub will ACTUALLY close, so the guard can check its
          # verdict against reality instead of re-reading the prose it was
          # given. It printed "clean (1 declared close: 108)" over a PR GitHub
          # had linked nothing for.
          #
          # NOT a second implementation of GitHub's adjacency rule. A
          # restatement agrees with GitHub only until GitHub changes it, and a
          # parity claim is enforced by CALLING the other thing.
          #
          # The guard distinguishes "GitHub linked nothing" from "I could not
          # look" BY THE FILE: empty is an empty set, missing is exit 2. So the
          # only thing that matters here is that a failed query leaves no file.
          #
          # `... > /tmp/pr_linked.txt || true` does NOT do that, though it
          # reads as if it does. The shell creates and truncates the redirect
          # target BEFORE `gh` runs, so a failed query leaves a 0-byte file
          # that EXISTS -- byte-identical to the real answer "this PR closes
          # nothing" -- and `|| true` discards the status that would have said
          # otherwise. A PR whose body the local prose parse found nothing in
          # then prints "clean -- no closing references (verified against
          # GitHub)" and merges, having verified nothing: precisely the
          # accidental close #182 exists to catch, under the sentence saying
          # it cannot happen. Measured 2026-09-19 in Git Bash (bash 5.2) and in
          # the Ubuntu runner's `bash -e`, which is the shell this step runs
          # under: a failing command behind `>` leaves the file present and
          # empty, whether or not it existed beforehand. The claim is about
          # POSIX redirection and is NOT asserted for PowerShell, where `>` is
          # `Out-File` -- naming a date without naming a shell is what D-071
          # records twice.
          #
          # So the STATUS decides whether the file is published at all. The
          # query writes a scratch path and only a zero exit promotes it; a
          # failure leaves the real path ABSENT and lets the guard say "I could
          # not look" in its own words, with its own exit 2 and its own
          # explanation. This step stays green either way, so a `gh` hiccup is
          # still reported as a fact about the query rather than about the
          # change -- which is what the `|| true` was reaching for.
          #
          # `tests/gates/close_guard_linked_file.sh` extracts this block from
          # this file and runs it against a stubbed `gh` in both states.
          rm -f /tmp/pr_linked.txt /tmp/pr_linked.raw
          if gh pr view "${{ github.event.pull_request.number }}"                --json closingIssuesReferences                --jq '.closingIssuesReferences[].number' > /tmp/pr_linked.raw
          then
            mv /tmp/pr_linked.raw /tmp/pr_linked.txt
            echo "GitHub says this PR closes:"; cat /tmp/pr_linked.txt
          else
            status=$?
            rm -f /tmp/pr_linked.raw
            echo "gh pr view failed (exit $status). Leaving /tmp/pr_linked.txt"
            echo "ABSENT so the close guard fails closed (exit 2) rather than"
            echo "reporting a verdict it never verified."
          fi

      - name: The PR template must not satisfy the audit gate by itself
        # Its text goes into every PR body, so one character decides whether this
        # check means anything. The commented examples use "->" and not ":"
        # because this checker does not strip HTML comments -- restore the colon
        # and every PR passes having recorded nothing, in a body that renders no
        # audit block at all.
        #
        # This lives in CI rather than pytest because the api container mounts
        # only apps/api, so no test in that tree can read .github/.
        working-directory: apps/api
        run: >-
          python -c "import sys;
          from pathlib import Path;
          from scripts.check_audit_evidence import missing_evidence;
          body = Path('../../.github/pull_request_template.md').read_text(encoding='utf-8');
          p = ' '.join(missing_evidence(body));
          sys.exit('UNFILLED PR TEMPLATE SATISFIES THE AUDIT GATE -- the commented
          examples must use an arrow, not a colon. missing_evidence() said: ' + (p or '(nothing)'))
          if ('no \"Findings:\" line' not in p or 'no \"Disposition:\" line' not in p)
          else print('PR template correctly fails the gate when unfilled.')"

      - name: Reject undeclared issue closes
        working-directory: apps/api
        run: |
          python -m scripts.check_issue_references \
            --title /tmp/pr_title.txt \
            --body /tmp/pr_body.txt \
            --commits /tmp/pr_commits.txt \
            --linked /tmp/pr_linked.txt

      - name: >-
          D-NUMBERS: a subject must not name a decision the commit does not add
          (this step is NOT about issue closes -- see its failure output)
        # ## Why this step lives in a job called "No accidental issue closes"
        #
        # It does not belong to that name, and GitHub shows a reader the JOB
        # name, never the step's. So a D-number mismatch turns a required check
        # called "No accidental issue closes" red, and the reader goes looking
        # for a closing keyword that is not there (#318, from the #296 review).
        # That is this repo's own guard-names-the-CHECK-not-the-CAUSE defect,
        # in the workflow file whose neighbouring comment states the principle.
        #
        # **It is not split into its own job, and that is a deliberate trade
        # rather than an oversight.** A new job is not a required check until
        # someone edits branch protection, so splitting it here would move a
        # currently-BLOCKING check into a non-blocking one and leave an
        # enforcement gap open for as long as it took anyone to notice. A
        # misleading name costs a wrong search; losing the block costs the
        # defect. Between the two, keep the block.
        #
        # So the cost is paid where it actually lands -- at the failure -- by
        # the step name above and by the banner the run prints below. Splitting
        # it properly needs a branch-protection change, which only a human with
        # admin can make, and is tracked rather than done unilaterally.
        #
        # PLACED LAST IN THIS JOB, DELIBERATELY. It used to run BEFORE
        # `Reject undeclared issue closes`, and neither later step carries an
        # `if:` or `continue-on-error` -- so a D-number failure SKIPPED the
        # close guard, and this banner then told the reader their closing
        # keywords were fine about a check that had never run. "I could not
        # look" wearing "nothing to complain about", emitted by the fix for a
        # reporting defect.
        #
        # Running last makes the assurance true by construction rather than by
        # wording: if this step is reached, the close guard has already passed.
        #
        # In this job at all because it already has the full history and the
        # branch's own commit range; no other workflow does.
        #
        # A branch shipped `docs(decisions): D-072 -- ...` for a commit adding
        # D-078. On rebase, every positional conflict in an append-only file
        # then looked like a D-number collision and had to be opened to find
        # out it was not one. The subject was the only thing that was wrong.
        #
        # This checks CONSISTENCY, not completeness: a subject naming no
        # decision is fine, because every squash merge on main is a PR title
        # that names none. Requiring completeness would have failed the whole
        # history to catch one defect -- measured against the real commits
        # before the boundary was chosen.
        run: |
          # The banner is the point. A reader arrives here from a red check
          # named "No accidental issue closes" and needs to be told, before
          # anything else, that the closing keywords are not what failed.
          # `set +e` / capture / `set -e`, NOT `if ! cmd; then status=$?`.
          # Inside the then-branch of a negated test, `$?` is the status of the
          # NEGATION -- 0 when the command failed. MEASURED:
          #
          #     bash -c 'if ! false; then echo $?; fi'   ->   0
          #
          # So that idiom would have printed the banner and exited 0: a step
          # that announces a failure and reports success. The exact shape
          # CLAUDE.md opens with, one layer down, inside the fix for a
          # different reporting defect.
          set +e
          python apps/api/scripts/check_decision_numbers.py             --base "origin/${{ github.base_ref }}" --head HEAD
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "=============================================================="
            echo "THIS STEP DOES NOT CHECK CLOSING KEYWORDS."
            echo ""
            echo "The red check is named 'No accidental issue closes' because"
            echo "this D-NUMBER step shares that job. What failed is above."
            echo ""
            # TWO EXIT CODES, TWO CAUSES. check_decision_numbers.py returns 1
            # for a real mismatch and 2 for 'I could not look' -- its own
            # __main__ says "a crash must not share an exit code with 'found
            # something'". A banner naming the exit-1 cause unconditionally
            # would hand a reader a false cause AND an imperative naming work
            # that cannot help.
            if [ "$status" -eq 1 ]; then
              echo "A commit SUBJECT names a D-number the commit does not add."
              echo "Fix the commit subject, not the PR body."
            else
              echo "The check could not run (exit $status) -- it reached no"
              echo "verdict about your commits. Read its output above: this is"
              echo "a git or environment failure, not something to fix in a"
              echo "commit message."
            fi
            echo ""
            echo "Tracked in #318."
            echo "=============================================================="
            exit $status
          fi
